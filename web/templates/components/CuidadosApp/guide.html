{% load static %}{% with illustration=guide.illustration %}<article class="care-guide"><img src="{% static illustration.image %}{% if illustration.revision %}?v={{ illustration.revision }}{% endif %}" alt="{{ illustration.alt }}" width="560" height="330" loading="lazy" decoding="async"><div class="care-guide-copy"><h2>{{ guide.title }}</h2><ol>{% for instruction in guide.instructions %}<li>{{ instruction }}</li>{% endfor %}</ol><p class="care-guide-precaution">{{ guide.precautions }}</p><a class="text-link" href="{{ guide.source_url }}" target="_blank" rel="noopener noreferrer">{{ guide.source_title }}</a><small>Referencia v{{ guide.version }} · ilustración orientativa</small></div></article>{% endwith %}
