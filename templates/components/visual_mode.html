{% if puede_cambiar_modo %}
<form action="{% url 'VisualMode' %}" method="post" class="visual-mode-form">
  {% csrf_token %}
  {% if modo_visual == 'dark' %}
  <span id="visual-mode-state" class="visual-mode-state">Modo oscuro</span>
  <input type="hidden" name="mode" value="light">
  <button type="submit" class="icon-button visual-mode-button" aria-label="Activar modo claro" aria-describedby="visual-mode-state" title="Activar modo claro">
    <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  {% else %}
  <span id="visual-mode-state" class="visual-mode-state">Modo claro</span>
  <input type="hidden" name="mode" value="dark">
  <button type="submit" class="icon-button visual-mode-button" aria-label="Activar modo oscuro" aria-describedby="visual-mode-state" title="Activar modo oscuro">
    <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 13.1A9 9 0 0 1 10.9 3.2 9 9 0 1 0 20.8 13.1Z"/></svg>
  </button>
  {% endif %}
</form>
{% endif %}
